[project]
name = "project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.0",
    "datasets",
    "expman",
    "h5py",
    "huggingface-hub>=0.19.3,<1.0",
    "joblib",
    "matplotlib>=3.9,<3.11",
    "scikit-learn",
    "scipy",
    "setuptools",
    "torch>=2.12.1",
    "timesfm[torch]>=3.0.1",
    "toto-models>=1.0.0",
    "transformers>=4.41,<4.42",
]

[tool.uv.sources]
# Vendored verbatim at revision 84a4d47 (see third_party/expman) and consumed
# as a local path dependency: reproduction needs no access to any external
# repository, and the scheduler behaviour is pinned to exactly the revision
# the paper's runs used.
expman = { path = "third_party/expman" }

# Domestic PyPI mirror: the experiment host is behind the GFW, where the
# default PyPI index is slow and flaky. Lockfile records the mirror so the
# remote `uv sync` resolves identical packages from it.
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

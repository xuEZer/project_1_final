# Pinned to a commit rather than a branch: expman's scheduler decides whether a
# Batch completes at all -- cold-start measurement, host-pressure shedding --
# so a silent move would change how the experiments run, not just their numbers.
# Bump the hash when expman's behaviour changes.
expman = { git = "https://github.com/xuEZer/expman.git", rev = "0e8c2bb1a33f212aaa61cb828a6930ec27195f60" }

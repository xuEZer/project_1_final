[experiment]
exp_name = default
exp_type = B1
random_seed = 42

[paths]
preprocessed_data_dir = ./cache/preprocessed_datasets
log_save_dir = ./logs

[dataset]
dataset = Supply_Chain_Customer_D
missing_rate = 0.2
artificial_missing_rate = 0.2
block_size = 20
lookback_len = 192
val_ratio = 0.1
test_ratio = 0.2

[training]
num_epoch = 10
device = cuda
batch_size = 32
auto_batch_size = true
micro_batch_size = 32
dataloader_num_workers = 0
pin_memory = true

optimizer = Adam
lr = 1e-3
min_lr = 1e-4
lr_scheduler = off

# TIP hyperparameters
tip_k = 10
tip_epsilon = 1e-3
tip_pretrain_epochs = 3

[imputator]
model_type = SAITS

[predictor]
model_type = Sundial

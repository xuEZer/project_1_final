[experiment]
exp_name = default
exp_type = B1
random_seed = 42

[paths]
preprocessed_data_dir = ./cache/preprocessed_datasets
ckpt_save_dir = ./cache/checkpoints
log_save_dir = ./logs

[dataset]
dataset = Supply_Chain_Customer_D
missing_rate = 0.2
artificial_missing_rate = 0.2
block_size = 20
lookback_len = 128
val_ratio = 0.1
test_ratio = 0.2

[training]
max_epoch = 10000
warmup_epoch = 3
patience = 5
device = cuda
batch_size = 128
auto_batch_size = true
micro_batch_size = 0

optimizer = AdamW
lr = 1e-4

# TIP hyperparameters
tip_k = 20
tip_epsilon = 1e-4
tip_pretrain_epochs = 2

[imputator]
model_type = SAITS

[predictor]
model_type = Sundial

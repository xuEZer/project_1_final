[experiment]
type = B1
seed = 42
load_ckpt =

[paths]
cache_dir = ./cache
log_dir = ./logs

[data]
dataset = Supply_Chain_Customer_D
missing_rate = 0.2
artificial_missing_rate = 0.2
block_size = 8
lookback = 384
pred_len = 48
val_ratio = 0.1
test_ratio = 0.2

[loader]
batch_size = 32
auto_batch = false
micro_batch = 0
num_workers = 0
pin_memory = true

[imputer]
model = SAITS

[predictor]
model = Sundial

[training]
max_epochs = 300
device = cuda
optimizer = AdamW
lr = 1e-3
patience = 20
min_delta = 1e-4

[tip]
k = 20
epsilon = 1e-3
confidence_delta = 0.05

[experiment]
exp_name = default
exp_type = B1
random_seed = 42

[paths]
preprocessed_data_dir = ./cache/preprocessed_datasets
log_save_dir = ./logs

[dataset]
dataset = Supply_Chain_Customer_D
missing_rate = 0.2
artificial_missing_rate = 0.2
block_size = 20
lookback_len = 128
val_ratio = 0
test_ratio = 0.3

[training]
num_epoch = 5
device = cuda
batch_size = 256
auto_batch_size = true
micro_batch_size = 0
dataloader_num_workers = 0
pin_memory = true

optimizer = Adam
lr = 1e-3

# TIP hyperparameters
tip_k = 5
tip_epsilon = 1e-4
tip_pretrain_epochs = 2
tip_preserve_grad_norm = true
# 0 disables the cap and exactly restores the pre-projection gradient norm.
tip_norm_scale_cap = 0

[imputator]
model_type = SAITS

[predictor]
model_type = Sundial

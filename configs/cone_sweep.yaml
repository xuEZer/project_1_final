# Window-level cone calibration sweep on the c1 cell, under the current
# regime (window-level UCB gate with FPC, probe=3, shuffled 7:1:2 split).
#
# Superseded by configs/worst_case_sweep.yaml, which additionally varies the
# radius family and the rank and records which branch of the closed-form
# feasible interval each step took.  This file is kept for reproducing the
# earlier t-quantile cone numbers: set `tip.cone_radius: student_t` below to
# recover them, since the default is now the multivariate chi-square radius.
#
# The cone now consumes per-window coordinate samples again, so beta is the
# large-df t-quantile (~1.9/1.3/0.5/0.1 for the four levels below).  B1 runs
# alongside B2 so every cone level has paired references under the same
# shuffled protocol.  Pick the cone_delta whose B2 endpoints sit at or below
# B4's before the full ablation is re-run.

name: ablation_base

stage: !choice [B1, B2]

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [102, 103, 104, 105, 106]

tip:
  cone_delta: 0.1

sweep:
  include_baseline: true
  axes:
    tip.cone_delta: [0.03, 0.3, 0.5]

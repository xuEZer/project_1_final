# B2-only tuning on seeds disjoint from the formal RQ3 comparison.  The grid
# is motivated by the completed RQ4 sensitivity run; the winning setting is
# selected by mean test prediction MSE and then frozen for seeds 42--51.

stage: B2

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [52, 53, 54, 55, 56]
missing_seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2

loader:
  batch_size: 128
  micro_batch: 0
  auto_batch: false
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  max_epochs: 5

tip:
  subspace_rank: !choice [2, 3]
  epsilon: !choice [0.00001, 0.001]
  confidence_delta: !choice [0.15, 0.2, 0.3, 0.4]

# Main experiment matrix.
#
# Equivalent to the former configs/main_exp.json + configs/global.ini pair:
# 160 runs = 2 stages x 4 datasets x 5 imputers x 4 predictors, with the same
# fixed protocol.  Everything the old global.ini supplied implicitly is now an
# explicit field, so a run's identity covers its whole configuration.
#
# `name:` selects defaults from configs/<field path>/<name>.yaml.

stage: !choice [B1, B2]

dataset:
  name: !choice
    - azure2019_I_5T
    - EWELD_Load_15T
    - Coastal_T_S_15T
    - MetroPT-3_5T

imputer:
  name: !choice
    - SAITS
    - DeepMVI
    - ModernTCN
    - TimesNet
    - TSLANet

predictor:
  name: !choice
    - Toto2
    - Chronos
    - Sundial
    - TimesFM3

# GPU resource list for expman's scheduler; [training] device is derived
# from it by src.pipeline.build_config.
device: [0]

seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 32
  lookback: 512
  pred_len: 16
  val_ratio: 0.1
  test_ratio: 0.2

loader:
  batch_size: 256
  micro_batch: 64
  auto_batch: false
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  max_epochs: 50
  patience: 5
  min_delta: 1.0e-4

tip:
  subspace_rank: 4
  epsilon: 0.001
  confidence_delta: 0.1

# Main experiment: 2 stages x 5 datasets x 5 imputers x 4 predictors.
# Each B1/B2 pair shares the best forecast-validation warm-up checkpoint.

stage: !choice [B1, B2]

dataset:
  name: !choice
    - EWELD_Load_15T
    - Coastal_T_S_15T
    - Port_Activity_D
    - Supply_Chain_Customer_D_Amazon
    - current_velocity_10T

imputer:
  name: !choice
    - SAITS
    - DeepMVI
    - ModernTCN
    - TimesNet
    - TSLANet

predictor:
  name: !choice
    - Toto2
    - Chronos
    - Sundial
    - TimesFM3

# GPU resource list for expman's scheduler; [training] device is derived
# from it by src.pipeline.build_config.
device: [0]

seed: 42
missing_seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2

loader:
  batch_size: 128
  micro_batch: 0
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  # Generic trainer compatibility; the staged protocol uses the values below.
  max_epochs: 20

pilot:
  subspace_rank: 3
  epsilon: 0.001
  gate_mode: safe_release
  cone_radius: hotelling
  delta: 0.3
  prediction_probe_batches: 4
  preserve_norm: true

protocol:
  patience: 5
  continuation_epochs: 1
  history_size: 2

# Held-out B2 search for the number of sampled probe batches.  The current
# optimizer batch is always included; seeds 77--81 remain development-only.

stage: B2
dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2
device: [0]
seed: !choice [77, 78, 79, 80, 81]
missing_seed: 42
paths:
  cache_dir: ./cache
  log_dir: ./logs
data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2
loader:
  batch_size: 128
  micro_batch: 0
  auto_batch: false
  num_workers: 0
  pin_memory: true
training:
  optimizer: AdamW
  lr: 0.001
  max_epochs: 5
tip:
  subspace_rank: 3
  epsilon: 0.00001
  gate_mode: lcb
  gate_delta: 0.3
  cone_delta: 0.03
  accept_only_if_improves: true
  prediction_probe_batches: !choice [1, 2, 3]

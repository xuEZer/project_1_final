# Held-out B2 search for a safety-oriented lower-confidence-bound gate.
# Seeds are disjoint from previous tuning and formal RQ3 runs.

stage: B2

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [62, 63, 64, 65, 66]
missing_seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2

loader:
  batch_size: 128
  micro_batch: 0
  auto_batch: false
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  max_epochs: 5

tip:
  subspace_rank: 3
  epsilon: 0.00001
  gate_mode: lcb
  gate_delta: !choice [0.1, 0.2, 0.3, 0.4]
  cone_delta: 0.1

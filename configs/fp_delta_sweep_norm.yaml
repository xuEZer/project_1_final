# Identical to configs/fp_delta_sweep.yaml except that the corrected
# displacement is rescaled back to the norm of the optimizer's own proposal
# (tip.preserve_norm).
#
# Why: without it, a correction that shortens the step is confounded with a
# correction that redirects it, and B1/B2 no longer differ only in direction.
# With it, both arms take steps of identical length and the comparison isolates
# the direction of the update.
#
# Why it is safe for the guarantee: the robust lower alignment
#
#     R(x) = c_hat^T x - beta * sqrt(x^T Sigma_tilde x)
#
# is positively homogeneous of degree one in x --- both terms are linear in x
# up to the square root --- so R(t x) = t R(x) for every t > 0.  Rescaling a
# feasible correction therefore keeps it feasible, and only its length changes.
#
#   python run_expman.py --config configs/fp_delta_sweep_norm.yaml
#
# 4 tip settings x 2 stages x 3 seeds = 24 runs at 20 epochs.

name: ablation_base

stage: !choice [B1, B2]

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [102, 103, 104]

training:
  max_epochs: 20

tip:
  subspace_rank: 3
  prediction_probe_batches: 4
  gate_mode: safe_release
  cone_radius: hotelling
  cone_delta: 0.1
  preserve_norm: true

sweep:
  mode: ofat
  include_baseline: true
  axes:
    tip.cone_delta: [0.05, 0.3, 0.5]

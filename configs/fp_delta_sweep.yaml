# cone_delta sweep for the finite-population design.
#
# Protocol: 20 epochs total.  The first tip.warmup_epochs = 10 let the
# reconstruction objective train the imputer on its own; the forecast
# mechanism (gate_mode safe_release) is engaged only for the remaining 10.
# B1 runs the same 20 epochs, so the two arms stay at matched steps and the
# only difference at the endpoint is the mechanism's second half.
#
# Probe budget: this cell runs 10 optimizer batches per epoch (the run logs
# report num_batches = 10, candidate_count = 9), so
# prediction_probe_batches = 4 puts the current batch plus four probe batches
# through the forecaster, i.e. half of the training set at each step.  The
# probe draw is uniform without replacement from the complement of the current
# optimizer batch, which is what makes the finite-population identities in
# Theorem 5 apply.
#
# The ellipsoid radius is pinned to hotelling: it is a statistical
# specification fixed by (rank, probe size, delta), not a method choice.
#
# preserve_norm gives the corrected displacement the same length as the
# optimizer's own proposal, so the two arms differ only in the direction of the
# step.  It is safe for the guarantee because the robust lower alignment is
# positively homogeneous of degree one, R(t x) = t R(x) for t > 0.
#
#   python run_expman.py --config configs/fp_delta_sweep.yaml
#
# 4 tip settings x 2 stages x 3 seeds = 24 runs.

name: ablation_base

stage: !choice [B1, B2]

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [102, 103, 104]

training:
  max_epochs: 20

tip:
  subspace_rank: 3
  prediction_probe_batches: 4
  gate_mode: safe_release
  cone_radius: hotelling
  cone_delta: 0.1
  preserve_norm: true
  warmup_epochs: 10

sweep:
  mode: ofat
  include_baseline: true
  axes:
    tip.cone_delta: [0.05, 0.3, 0.5]

# Finite-population smoke sweep on the c1 cell.
#
# Validates the revised statistical design end to end on real data before any
# full rerun.
#
# The only swept axis is the probe budget, which is a genuine resource
# trade-off: more probe batches cost forecaster queries and shrink the
# finite-population factor 1 - f_t.  Everything else is pinned.
#
# In particular the radius is NOT a sweep axis.  It is a statistical
# specification fixed by the rank r, the probe size m and the level delta, not
# a method choice:
#
#   beta^2 = r(m-1)/(m-r) * F_{r,m-r,1-delta}     (hotelling, exact under
#                                                  normality)
#   beta^2 = chi2_{r,1-delta}                     (its large-sample limit)
#   beta   = t_{1-delta,m-1}                      (the r = 1 special case)
#
# The numerical self-test measures coverage on a rank-8 population as
# 0.895 / 0.885 / 0.005 against a nominal 0.90, so the univariate Student-t
# radius is simply mis-specified for r > 1.  Sweeping the family would mean
# selecting a radius by its endpoint score, and the arm that scores best is the
# one that under-covers and therefore barely corrects at all: that is selection
# of a falsified statistical assumption on the test split.  The family is kept
# as a config key only so the coverage table above can be reproduced.
#
# The probe draw is uniform without replacement from the complement of the
# current optimizer batch, which is what makes Theorem 5 (finite-population
# mean and covariance) applicable.
#
#   python run_expman.py --config configs/finite_population_smoke.yaml

name: ablation_base

stage: !choice [B1, B2]

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [102, 103]

training:
  max_epochs: 10

tip:
  subspace_rank: 3
  prediction_probe_batches: 3
  gate_mode: safe_release
  cone_radius: hotelling
  cone_delta: 0.1

sweep:
  mode: ofat
  include_baseline: true
  axes:
    tip.prediction_probe_batches: [1, 6]

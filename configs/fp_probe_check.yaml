# One-run diagnostic: report the real training-population size and the number
# of optimizer batches per epoch, so the probe budget can be stated against the
# actual numbers instead of inferred from candidate_count.
#
#   python run_expman.py --config configs/fp_probe_check.yaml

name: ablation_base

stage: B2

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: 102

training:
  max_epochs: 1

tip:
  subspace_rank: 3
  prediction_probe_batches: 4
  gate_mode: safe_release
  cone_radius: hotelling
  cone_delta: 0.1

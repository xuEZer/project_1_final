# Worst-case ray-correction sweep on the c1 cell.
#
# The new correction walks the ray x(lambda) = a + lambda * cbar and is feasible
# exactly on the sublevel set {lambda >= 0 : f(lambda) >= 0} of the concave
# worst-case margin
#
#     f(lambda) = cbar^T x(lambda)
#                 - beta * sqrt(x(lambda)^T Sigma_bar x(lambda)).
#
# Two roots of one quadratic cut that set out, so both endpoints are closed
# form.  Which shape the set has is decided by the large-lambda slope
# p1 - beta * sqrt(q2), i.e. by the radius beta against the coordinate
# t-statistic:
#
#     beta > ||cbar||^2 / sqrt(cbar^T Sigma_bar cbar)  ->  bounded [l1, l2]
#     otherwise                                        ->  ray [l1, inf)
#
# `cone_delta` sets beta and `subspace_rank` sets the dimension of the
# ellipsoid, so those two axes move the boundary; `cone_radius` picks the
# quantile family, where `chi2` is the multivariate radius
# sqrt(chi2_{rank,1-delta}) and `student_t` is the univariate radius used by the
# earlier cone implementation (the rank = 1 special case).  This sweep exists to
# locate that boundary and to show which regime the pipeline actually lands in.
#
# Every cell runs B1 alongside B2 so the endpoint comparison stays paired under
# the same seed.  Pick the cone_delta whose B2 endpoints sit at or below B4's
# before re-running the full ablation:
#
#     python run_expman.py --config configs/worst_case_sweep.yaml

name: ablation_base

stage: !choice [B1, B2]

dataset:
  name: azure2019_I_5T
imputer:
  name: SAITS
predictor:
  name: Toto2

device: [0]
seed: !choice [102, 103, 104]

tip:
  subspace_rank: 3
  cone_delta: 0.1
  cone_radius: chi2

sweep:
  # The grid covers the base values (chi2, 0.1, 3), so no separate control run
  # is needed; B1 supplies the paired reference for every cell.
  mode: grid
  include_baseline: false
  axes:
    tip.cone_radius: [chi2, student_t]
    tip.cone_delta: [0.01, 0.05, 0.1, 0.3]
    tip.subspace_rank: [3, 8]

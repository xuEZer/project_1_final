# Shared protocol for the RQ3 component ablation (see ablation.yaml).
# Every root !choice candidate pulls this file through its root `name`.
device: [0]
missing_seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2

loader:
  batch_size: 128
  micro_batch: 0
  auto_batch: false
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  max_epochs: 20

tip:
  subspace_rank: 3
  epsilon: 0.001
  gate_mode: ucb
  gate_delta: 0.1
  cone_delta: 0.1
  accept_only_if_improves: false
  prediction_probe_batches: 15

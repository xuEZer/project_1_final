# current_velocity_10T / ModernTCN / Chronos, seed=missing_seed=42.
# Shared forecast-validation patience=5 warm-up; each branch continues 1 epoch.
stage: B2

dataset:
  name: current_velocity_10T

imputer:
  name: ModernTCN

predictor:
  name: Chronos

# GPU resource list for expman's scheduler; [training] device is derived
# from it by src.pipeline.build_config.
device: [0]

seed: 42
missing_seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2

loader:
  batch_size: 128
  micro_batch: 0
  auto_batch: false
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  # Generic trainer compatibility; the staged protocol uses the values below.
  max_epochs: 20

tip:
  subspace_rank: 3
  epsilon: 0.001
  gate_mode: safe_release
  cone_radius: hotelling
  gate_delta: 0.1
  cone_delta: 0.3
  accept_only_if_improves: false
  prediction_probe_batches: 4
  preserve_norm: true
  warmup_epochs: 0

protocol:
  patience: 5
  continuation_epochs: 1
  history_size: 2

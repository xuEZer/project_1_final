# Shared protocol for the RQ3 component ablation (see ablation.yaml).
# Every root !choice candidate pulls this file through its root `name`.
device: [0]
missing_seed: 42

paths:
  cache_dir: ./cache
  log_dir: ./logs

data:
  missing_rate: 0.2
  artificial_missing_rate: 0.2
  block_size: 8
  lookback: 256
  pred_len: 8
  val_ratio: 0.1
  test_ratio: 0.2
  # Random window split holding the 7:1:2 sample counts, instead of a
  # contiguous time-ordered cut.  The whole series is windowed first and the
  # windows are permuted; the synthetic natural mask is then spread over the
  # whole series, since there is no test span left to confine it to.
  split_mode: shuffled

loader:
  batch_size: 128
  micro_batch: 0
  auto_batch: false
  num_workers: 0
  pin_memory: true

training:
  optimizer: AdamW
  lr: 0.001
  max_epochs: 20

tip:
  # Validated recipe (configs/fp_delta_sweep.yaml, 24/24 succeeded, B2 -6..-9%
  # below B1 on c1): the forecast mechanism sleeps for the first half of
  # training and engages only for the second half; the safe_release gate and
  # the Hotelling ellipsoid implement the finite-population theory; the
  # corrected displacement keeps the optimizer's step norm so the two arms
  # differ in direction only.
  subspace_rank: 3
  epsilon: 0.001
  gate_mode: safe_release
  cone_radius: hotelling
  cone_delta: 0.1
  accept_only_if_improves: false
  prediction_probe_batches: 4
  preserve_norm: true
  warmup_epochs: 10
